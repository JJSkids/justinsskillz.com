<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess AI - Justin's Skillz</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- App Header -->
    <header class="app-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">♟️</span>
                <span>Justin's Skillz</span>
            </a>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="chess.html" class="nav-link active">Chess Arena</a>
            </nav>
            <div class="nav-actions">
                <button class="theme-toggle-btn" id="themeToggle">
                    <span>🌙</span> <span id="themeText">Dark</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <h1 class="dashboard-title">Chess Arena</h1>
            <p class="dashboard-subtitle">Test your strategy, analyze openings, and sharpen your tactical thinking.</p>
            
            <div class="card">
                <div class="chess-layout">
                    <div class="board-frame" id="board">
                        <div style="text-align: center; color: var(--text-muted); padding: 2rem;">
                            <p style="font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">Board Initialized</p>
                            <p style="font-size: 0.9rem;">Ready for your chess engine or interactive move logic script.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
        <div class="container">
            <p class="footer-text">&copy; 2026 Justin's Skillz. Built for peak performance.</p>
        </div>
    </footer>
</body>
</html>
