<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Justin's Skillz Cloud...</title>
  <style>
    body { background: #07090f; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(168,85,247,0.2); border-top-color: #a855f7; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1.5rem; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="color: #a855f7; margin-bottom: 0.5rem;">Migrating Your Progress to Cloud...</h2>
  <p style="color: #94a3b8; font-size: 0.95rem;">Transferring local settings and scores to justinsskillz.web.app</p>

  <script>
    // Package all localStorage items
    const localData = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      localData[key] = localStorage.getItem(key);
    }

    const encodedPayload = encodeURIComponent(JSON.stringify(localData));
    const targetUrl = `https://justinsskillz.web.app/index.html?migrate=${encodedPayload}`;

    // Redirect after brief delay
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 1200);
  </script>
</body>
</html>
