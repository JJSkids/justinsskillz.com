<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Sandbox | Justin's Skillz</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="nav-header">
        <a href="../dashboard.html" class="btn btn-primary">← Workspace Dashboard</a>
        <h2 style="margin: 0; font-size: 1.2rem; color: var(--accent-gold);">📐 Advanced Mathematics</h2>
    </header>

    <main class="container">
        <div class="card">
            <h1 style="margin-top: 0;">Quadratic & Complex Roots Solver</h1>
            <p style="color: var(--text-muted);">Solve equations in the form $ax^2 + bx + c = 0$:</p>
            
            <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                <input id="coeffA" type="number" class="input-field" placeholder="a" style="width: 80px;" value="1">
                <span>$x^2 +$</span>
                <input id="coeffB" type="number" class="input-field" placeholder="b" style="width: 80px;" value="2">
                <span>$x +$</span>
                <input id="coeffC" type="number" class="input-field" placeholder="c" style="width: 80px;" value="5">
                <span>$= 0$</span>
                <button onclick="calculateRoots()" class="btn btn-primary">Compute Roots</button>
            </div>

            <div id="mathOutput" class="result-box" style="color: var(--accent-green);">
                Click Compute to solve the polynomial roots.
            </div>
        </div>
    </main>

    <script>
      function calculateRoots() {
        const a = parseFloat(document.getElementById('coeffA').value);
        const b = parseFloat(document.getElementById('coeffB').value);
        const c = parseFloat(document.getElementById('coeffC').value);
        const out = document.getElementById('mathOutput');

        if (isNaN(a) || isNaN(b) || isNaN(c) || a === 0) {
          out.innerText = "Please enter valid non-zero coefficients.";
          return;
        }

        const disc = b * b - 4 * a * c;
        if (disc > 0) {
          const x1 = (-b + Math.sqrt(disc)) / (2 * a);
          const x2 = (-b - Math.sqrt(disc)) / (2 * a);
          out.innerText = `Two Real Roots: x₁ = ${x1.toFixed(3)}, x₂ = ${x2.toFixed(3)}`;
        } else if (disc === 0) {
          const x = -b / (2 * a);
          out.innerText = `One Double Root: x = ${x.toFixed(3)}`;
        } else {
          const real = (-b / (2 * a)).toFixed(3);
          const imag = (Math.sqrt(-disc) / (2 * a)).toFixed(3);
          out.innerText = `Complex Conjugate Pair: x = ${real} ± ${imag}i`;
        }
      }
    </script>
</body>
</html>
