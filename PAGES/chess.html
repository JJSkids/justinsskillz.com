<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Justin's Skillz - Mobile Chess</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="back-button">← Back</a>
    <h1>Skillz Chess Lab</h1>
  </header>

  <main class="container">
    <!-- Status Display -->
    <div class="status-panel">
      <div id="turn-indicator" class="turn-badge white-turn">
        Turn: <span id="current-player">White</span>
      </div>
      <button id="reset-btn" class="btn">Reset Game</button>
    </div>

    <!-- Chess Board Container -->
    <div class="chess-container">
      <div id="chess-board"></div>
    </div>
  </main>

  <script src="PAGES/chess.js"></script>
</body>
</html>
