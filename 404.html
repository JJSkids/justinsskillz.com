<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in Space | Justin's Skillz</title>
  
  <link rel="icon" type="image/jpeg" href="Justin's Skillz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: rgba(24, 27, 37, 0.75);
      --border-subtle: #2d3242;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Animated Starfield Background */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      background-position: 0 0, 40px 60px, 130px 270px;
      animation: starMove 90s linear infinite;
    }

    @keyframes starMove {
      from { background-position: 0 0, 40px 60px, 130px 270px; }
      to { background-position: 550px 1100px, 440px 760px, 1130px 1270px; }
    }

    /* Content Container */
    .container {
      text-align: center;
      z-index: 2;
      padding: 2.5rem 2rem;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      margin: 1rem;
    }

    .error-code {
      font-size: 7.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: float 4s ease-in-out infinite;
      letter-spacing: -2px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 1rem 0 0.5rem 0;
      letter-spacing: 0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .timer-msg {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.6rem 1.25rem;
      border-radius: 99px;
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    #countdown {
      color: var(--accent-pink);
      font-weight: 800;
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(168, 85, 247, 0.5);
      opacity: 0.95;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stars, .error-code {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <main class="container">
    <div class="error-code">404</div>
    <h1>LOST IN SPACE</h1>
    <p>The page you are looking for has drifted out into the deep void or never existed in this dimension.</p>
    
    <div class="timer-msg">
      🚀 Hyper-jump home in <span id="countdown">10</span>s
    </div>

    <div class="actions">
      <!-- Using index.html ensures compatibility with GitHub Pages repo subpaths -->
      <a href="index.html" class="btn">Take Me Home</a>
      <button id="pause-btn" class="btn btn-secondary" onclick="toggleTimer()">Pause Jump</button>
    </div>
  </main>

  <script>
    let timeLeft = 10;
    let isPaused = false;
    const countdownElement = document.getElementById('countdown');
    const pauseBtn = document.getElementById('pause-btn');

    const interval = setInterval(() => {
      if (isPaused) return;
      
      timeLeft--;
      countdownElement.textContent = timeLeft;
      
      if (timeLeft <= 0) {
        clearInterval(interval);
        window.location.href = "index.html";
      }
    }, 1000);

    function toggleTimer() {
      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.textContent = "Resume Jump";
        pauseBtn.style.borderColor = "var(--accent-purple)";
      } else {
        pauseBtn.textContent = "Pause Jump";
        pauseBtn.style.borderColor = "var(--border-subtle)";
      }
    }
  </script>
</body>
</html>
