<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassDojo - Sign In</title>
    <script src="guard.js"></script>
    <style>
        :root {
            --dojo-green: #00c853;
            --dojo-blue: #0288d1;
            --dojo-purple: #7c4dff;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #09203f 0%, #537895 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.1);
            text-align: center;
            color: var(--text-light);
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .logo-box svg { width: 48px; height: 48px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
        .logo-title { font-size: 1.8rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .logo-title span { color: var(--dojo-green); }

        .role-tabs {
            display: flex;
            background: rgba(0,0,0,0.25);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--dojo-blue);
            color: #fff;
            box-shadow: 0 4px 12px rgba(2, 136, 209, 0.4);
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        .form-control:focus { border-color: var(--dojo-green); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: var(--dojo-green);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.4);
            transition: transform 0.15s, background 0.2s;
        }

        .btn-submit:hover { transform: translateY(-2px); background: #00e676; }
        .btn-submit:active { transform: translateY(0); }

        .student-select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 1.25rem;
            padding-right: 4px;
        }

        .student-avatar-card {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .student-avatar-card:hover, .student-avatar-card.selected {
            border-color: var(--dojo-purple);
            background: rgba(124, 77, 255, 0.15);
        }

        .student-avatar-card svg { width: 40px; height: 40px; }
        .student-avatar-card span { display: block; font-size: 0.75rem; font-weight: 600; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-box">
        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#00c853" />
            <circle cx="35" cy="40" r="12" fill="#fff" />
            <circle cx="65" cy="40" r="12" fill="#fff" />
            <circle cx="35" cy="40" r="5" fill="#0f172a" />
            <circle cx="65" cy="40" r="5" fill="#0f172a" />
            <path d="M 30 65 Q 50 80 70 65" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" />
        </svg>
        <div class="logo-title">Class<span>Dojo</span></div>
    </div>

    <div class="role-tabs">
        <button class="tab-btn active" id="tab-teacher" onclick="switchRole('teacher')">Teacher</button>
        <button class="tab-btn" id="tab-student" onclick="switchRole('student')">Student</button>
    </div>

    <!-- Teacher Form -->
    <form id="teacher-form" onsubmit="handleLogin(event, 'teacher')">
        <div class="form-group">
            <label>Teacher Name / Class Code</label>
            <input type="text" id="teacher-name" class="form-control" value="Mr. Jeffrey" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" value="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Enter Classroom 🚀</button>
    </form>

    <!-- Student Form -->
    <div id="student-form" class="hidden">
        <div class="form-group">
            <label>Choose Your Monster Avatar</label>
            <div class="student-select-grid" id="student-grid"></div>
        </div>
        <button type="button" class="btn-submit" style="background: var(--dojo-purple);" onclick="handleStudentLogin()">Join Class Island 🏝️</button>
    </div>
</div>

<script>
    let activeRole = 'teacher';
    let selectedStudentId = null;

    const mockStudents = [
        { id: 's1', name: 'Justin', color: '#00c853' },
        { id: 's2', name: 'Sophia', color: '#7c4dff' },
        { id: 's3', name: 'Alex', color: '#0288d1' },
        { id: 's4', name: 'Emma', color: '#f59e0b' },
        { id: 's5', name: 'Lucas', color: '#ec4899' },
        { id: 's6', name: 'Maya', color: '#06b6d4' }
    ];

    function renderStudentGrid() {
        const grid = document.getElementById('student-grid');
        grid.innerHTML = mockStudents.map(s => `
            <div class="student-avatar-card ${selectedStudentId === s.id ? 'selected' : ''}" onclick="selectStudent('${s.id}')">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" fill="${s.color}" />
                    <circle cx="38" cy="42" r="8" fill="#fff" /><circle cx="62" cy="42" r="8" fill="#fff" />
                    <circle cx="38" cy="42" r="3" fill="#000" /><circle cx="62" cy="42" r="3" fill="#000" />
                    <path d="M 35 65 Q 50 75 65 65" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" />
                </svg>
                <span>${s.name}</span>
            </div>
        `).join('');
    }

    function selectStudent(id) {
        selectedStudentId = id;
        renderStudentGrid();
    }

    function switchRole(role) {
        activeRole = role;
        document.getElementById('tab-teacher').classList.toggle('active', role === 'teacher');
        document.getElementById('tab-student').classList.toggle('active', role === 'student');
        document.getElementById('teacher-form').classList.toggle('hidden', role !== 'teacher');
        document.getElementById('student-form').classList.toggle('hidden', role !== 'student');
        if (role === 'student') renderStudentGrid();
    }

    function handleLogin(e, role) {
        e.preventDefault();
        const username = document.getElementById('teacher-name').value;
        setDojoSession({ username: username, role: 'teacher' });
        window.location.href = 'index.html';
    }

    function handleStudentLogin() {
        if (!selectedStudentId) {
            alert('Please select your monster avatar!');
            return;
        }
        const student = mockStudents.find(s => s.id === selectedStudentId);
        setDojoSession({ username: student.name, role: 'student', studentId: student.id });
        window.location.href = 'island.html';
    }
</script>
</body>
</html>
