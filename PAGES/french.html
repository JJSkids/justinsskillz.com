<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Practice | Justin's Skillz</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header class="nav-header">
        <a href="../dashboard.html" class="btn btn-primary">← Workspace Dashboard</a>
        <h2 style="margin: 0; font-size: 1.2rem; color: var(--accent-pink);">🇫🇷 French Grammar Studio</h2>
    </header>

    <main class="container">
        <div class="card">
            <h1 style="margin-top: 0;">Verb Conjugation Master</h1>
            <p style="color: var(--text-muted);">Complete the conjugated verb in the present tense:</p>

            <div style="background: var(--bg-main); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color);">
                <p style="font-size: 1.1rem;">Fill in the blank: <em>"Nous ________ (avoir) un grand projet."</em></p>
                <input id="frenchInput" type="text" class="input-field" placeholder="Type conjugated verb...">
                <button onclick="checkFrench()" class="btn btn-pink" style="margin-left: 0.5rem;">Check Answer</button>
            </div>

            <div id="frenchOutput" class="result-box">
                Type your conjugation above.
            </div>
        </div>
    </main>

    <script>
      function checkFrench() {
        const val = document.getElementById('frenchInput').value.trim().toLowerCase();
        const out = document.getElementById('frenchOutput');
        if (val === 'avons') {
          out.innerText = "Trés bien! 'avons' is the correct present tense form of avoir for 'nous'.";
          out.style.color = "#34d399";
        } else {
          out.innerText = "Try again! Remember: Nous + avoir = ?";
          out.style.color = "#ef4444";
        }
      }
    </script>
</body>
</html>
