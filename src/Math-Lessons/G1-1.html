<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 1: Arithmetic Foundations - Justin's Skillz</title>
  
  <link rel="icon" type="image/jpeg" href="../../Justin's Skillz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../styles.css">
  <script src="../theme.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../math-tracker.js"></script>

  <style>
    :root, [data-theme="dark"] {
      --bg-primary: #0f1117;
      --bg-card: #181b25;
      --border-subtle: #2d3242;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-rose: #f43f5e;
      --header-bg: rgba(15, 17, 23, 0.85);
      --radius-lg: 16px;
      --radius-md: 10px;
    }
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --border-subtle: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-purple: #9333ea;
      --accent-blue: #2563eb;
      --accent-green: #059669;
      --accent-rose: #e11d48;
      --header-bg: rgba(248, 250, 252, 0.85);
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }
    .app-header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1.5rem;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.1rem;
    }
    .nav-logo-img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-purple);
    }
    .gradient-text {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .main-container {
      max-width: 750px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .lesson-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      gap: 1rem;
    }
    .progress-bar-container {
      flex: 1;
      height: 10px;
      background: var(--border-subtle);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.4s ease;
    }
    .lesson-question-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media(min-width: 640px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .option-btn {
      background: var(--bg-primary);
      border: 2px solid var(--border-subtle);
      color: var(--text-main);
      padding: 1.1rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover {
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.05);
    }
    .option-btn.selected {
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.15);
    }
    .option-btn.correct {
      border-color: var(--accent-green) !important;
      background: rgba(16, 185, 129, 0.2) !important;
      color: var(--accent-green);
    }
    .option-btn.incorrect {
      border-color: var(--accent-rose) !important;
      background: rgba(244, 63, 94, 0.2) !important;
      color: var(--accent-rose);
    }
    .feedback-box {
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      display: none;
    }
    .feedback-box.correct {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      display: block;
    }
    .feedback-box.incorrect {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border: 1px solid var(--accent-rose);
      display: block;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: var(--accent-purple);
      color: white;
    }
    .btn-secondary {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-container">
      <a href="../../index.html" class="logo">
        <img src="../../Justin's Skillz.jpg" alt="Logo" class="nav-logo-img">
        <span class="logo-text">JUSTIN'S <span class="gradient-text">SKILLZ</span></span>
      </a>
      <a href="../math.html" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">← Back to Math Path</a>
    </div>
  </header>

  <main class="main-container">
    <div class="lesson-header-bar">
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="lessonProgressFill"></div>
      </div>
      <div id="lessonScoreBadge" style="font-weight: 700; color: var(--accent-purple); font-size: 0.9rem;">Score: 0</div>
    </div>

    <div class="lesson-question-card" id="lessonCardContent">
      <!-- Injected question content -->
    </div>
  </main>

  <script>
    const lessonQuestions = [
      { q: "What is 12 + 7?", options: ["17", "18", "19", "20"], correct: 2, explanation: "12 plus 7 equals 19." },
      { q: "Which number is greater: 45 or 54?", options: ["45", "54", "They are equal", "Neither"], correct: 1, explanation: "54 has 5 tens and 4 units, making it greater than 45." },
      { q: "If you have 15 apples and eat 6, how many do you have left?", options: ["8", "9", "10", "11"], correct: 1, explanation: "15 - 6 = 9." }
    ];

    let currentQIndex = 0;
    let userScore = 0;
    let selectedOptionIndex = null;
    let hasAnsweredCurrent = false;

    window.addEventListener('DOMContentLoaded', () => {
      renderQuestion();
    });

    function renderQuestion() {
      if (currentQIndex >= lessonQuestions.length) {
        showCompletionScreen();
        return;
      }

      const qData = lessonQuestions[currentQIndex];
      const progressPercent = (currentQIndex / lessonQuestions.length) * 100;
      document.getElementById('lessonProgressFill').style.width = `${progressPercent}%`;
      document.getElementById('lessonScoreBadge').textContent = `Score: ${userScore}`;

      let optionsHtml = '';
      qData.options.forEach((opt, idx) => {
        optionsHtml += `<button type="button" class="option-btn" id="optBtn-${idx}" onclick="selectOption(${idx})">${String.fromCharCode(65 + idx)}. ${opt}</button>`;
      });

      const card = document.getElementById('lessonCardContent');
      card.innerHTML = `
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--accent-purple); text-transform: uppercase;">Lesson G1-1 • Question ${currentQIndex + 1} of ${lessonQuestions.length}</span>
        <h2 style="margin: 0.5rem 0 1.5rem 0; font-size: 1.35rem; line-height: 1.4;">${qData.q}</h2>
        <div class="options-grid">${optionsHtml}</div>
        <div id="feedbackBox" class="feedback-box"></div>
        <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
          <button type="button" class="btn btn-primary" id="actionBtn" onclick="handleActionBtn()" disabled style="opacity: 0.5;">Select an Option</button>
        </div>
      `;
      selectedOptionIndex = null;
      hasAnsweredCurrent = false;
    }

    function selectOption(idx) {
      if (hasAnsweredCurrent) return;
      selectedOptionIndex = idx;
      document.querySelectorAll('.option-btn').forEach((btn, i) => {
        if (i === idx) btn.classList.add('selected');
        else btn.classList.remove('selected');
      });

      const actionBtn = document.getElementById('actionBtn');
      actionBtn.disabled = false;
      actionBtn.style.opacity = '1';
      actionBtn.textContent = 'Check Answer';
    }

    function handleActionBtn() {
      if (selectedOptionIndex === null) return;
      const qData = lessonQuestions[currentQIndex];
      const feedbackBox = document.getElementById('feedbackBox');
      const actionBtn = document.getElementById('actionBtn');
      hasAnsweredCurrent = true;

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.style.cursor = 'default');

      if (selectedOptionIndex === qData.correct) {
        buttons[selectedOptionIndex].classList.add('correct');
        feedbackBox.className = 'feedback-box correct';
        feedbackBox.innerHTML = `<strong>Correct! 🎉</strong> ${qData.explanation}`;
        userScore += 10;
      } else {
        buttons[selectedOptionIndex].classList.add('incorrect');
        buttons[qData.correct].classList.add('correct');
        feedbackBox.className = 'feedback-box incorrect';
        feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${qData.explanation}`;
      }

      document.getElementById('lessonScoreBadge').textContent = `Score: ${userScore}`;

      if (currentQIndex < lessonQuestions.length - 1) {
        actionBtn.textContent = 'Next Question →';
        actionBtn.onclick = () => {
          currentQIndex++;
          renderQuestion();
        };
      } else {
        actionBtn.textContent = 'Complete Lesson 🏆';
        actionBtn.onclick = showCompletionScreen;
      }
    }

    async function showCompletionScreen() {
      document.getElementById('lessonProgressFill').style.width = '100%';
      const totalPossibleScore = lessonQuestions.length * 10;

      // REQUIREMENT: Must answer ALL questions correctly to pass
      if (userScore < totalPossibleScore) {
        const card = document.getElementById('lessonCardContent');
        card.innerHTML = `
          <div style="text-align: center; padding: 2rem 0;">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔄</div>
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--accent-rose);">Almost There!</h2>
            <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 1.5rem;">You scored ${userScore} / ${totalPossibleScore} XP. You need 100% correct to pass this lesson and unlock the next one!</p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
              <button type="button" class="btn btn-primary" onclick="window.location.reload()">Try Again</button>
              <a href="../math.html" class="btn btn-secondary">Return to Math Path</a>
            </div>
          </div>
        `;
        return; // Stop execution; does not record completion
      }

      // --- 100% PASS SUCCESS CODE ---

      // 1. Record in tracker system (Supabase / math-tracker.js)
      if (typeof markLessonComplete === 'function') {
        await markLessonComplete('G1-1');
      }

      // 2. Record locally so math.html unlocks G1-2
      let completed = [];
      try { completed = JSON.parse(localStorage.getItem('math_completed_lessons') || '[]'); } catch(e) {}
      if (!completed.includes('G1-1')) {
        completed.push('G1-1');
        localStorage.setItem('math_completed_lessons', JSON.stringify(completed));
      }
      localStorage.setItem('duo_just_unlocked', 'G1-1');

      // 3. Render Victory Screen
      const card = document.getElementById('lessonCardContent');
      card.innerHTML = `
        <div style="text-align: center; padding: 2rem 0;">
          <div style="font-size: 3.5rem; margin-bottom: 1rem;">🏆</div>
          <h2 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--accent-green);">Lesson Completed!</h2>
          <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 1.5rem;">Flawless victory! You earned ${userScore} XP with a perfect score.</p>
          <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <button type="button" class="btn btn-primary" onclick="window.location.reload()">Practice Again</button>
            <a href="../math.html" class="btn btn-secondary">Return to Math Path</a>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
