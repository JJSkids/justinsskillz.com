<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess AI - Justin's Skillz</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .chess-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 600px;
      margin: 2rem auto;
    }
    .board-frame {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 2px solid var(--border-accent);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      user-select: none;
    }
    .square.light { background-color: #1e293b; }
    .square.dark { background-color: #0f172a; }
    .square.selected { background-color: rgba(56, 189, 248, 0.4) !important; }
    .square.highlight::after {
      content: '';
      width: 30%;
      height: 30%;
      background-color: rgba(56, 189, 248, 0.6);
      border-radius: 50%;
    }
    .piece-img {
      width: 85%;
      height: 85%;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .controls-panel {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="logo">Justin's Skillz</div>
    <a href="../index.html" class="back-button">← Back to Home</a>
  </header>

  <main class="container">
    <div class="chess-container">
      <h2>♟️ Smart Chess AI Engine</h2>
      
      <div class="controls-panel">
        <label for="ai-depth">AI Depth:</label>
        <select id="ai-depth" class="btn-secondary">
          <option value="1">Depth 1 (Fast)</option>
          <option value="2">Depth 2 (Medium)</option>
          <option value="3" selected>Depth 3 (Smart)</option>
        </select>
        <button id="reset-btn" class="btn-primary">New Game</button>
      </div>

      <div id="chess-board" class="board-frame"></div>
      <div id="game-status" class="greeting-badge">Your turn (White)</div>
    </div>
  </main>

  <!-- External Chess Move Logic Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  
  <script>
    // Wikimedia high-res SVG piece sprites URL map
    const PIECE_SPRITES = {
      p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
      r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
      n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
      b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
      q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
      k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
      P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
      R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
      N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
      B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
      Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
      K: 'https://upload.wikimedia.org/wikipedia/commons/4/4c/Chess_klt45.svg'
    };

    // Positional evaluation values (Center control & piece placement)
    const PAWN_PST = [
      0,  0,  0,  0,  0,  0,  0,  0,
      50, 50, 50, 50, 50, 50, 50, 50,
      10, 10, 20, 30, 30, 20, 10, 10,
       5,  5, 10, 25, 25, 10,  5,  5,
       0,  0,  0, 20, 20,  0,  0,  0,
       5, -5,-10,  0,  0,-10, -5,  5,
       5, 10, 10,-20,-20, 10, 10,  5,
       0,  0,  0,  0,  0,  0,  0,  0
    ];

    const KNIGHT_PST = [
      -50,-40,-30,-30,-30,-30,-40,-50,
      -40,-20,  0,  0,  0,  0,-20,-40,
      -30,  0, 10, 15, 15, 10,  0,-30,
      -30,  5, 15, 20, 20, 15,  5,-30,
      -30,  0, 15, 20, 20, 15,  0,-30,
      -30,  5, 10, 15, 15, 10,  5,-30,
      -40,-20,  0,  5,  5,  0,-20,-40,
      -50,-40,-30,-30,-30,-30,-40,-50
    ];

    const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    const game = new Chess();
    let selectedSquare = null;

    function evaluateBoard(board) {
      let totalEval = 0;
      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
          const piece = board[i][j];
          if (piece) {
            const val = PIECE_VALUES[piece.type];
            let pstVal = 0;
            const idx = i * 8 + j;
            if (piece.type === 'p') pstVal = PAWN_PST[idx];
            if (piece.type === 'n') pstVal = KNIGHT_PST[idx];

            const score = val + pstVal;
            totalEval += (piece.color === 'w' ? score : -score);
          }
        }
      }
      return totalEval;
    }

    // Minimax with Alpha-Beta Pruning
    function minimax(depth, alpha, beta, isMaximizing) {
      if (depth === 0 || game.game_over()) {
        return evaluateBoard(game.board());
      }

      const moves = game.moves();
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let move of moves) {
          game.move(move);
          let evalVal = minimax(depth - 1, alpha, beta, false);
          game.undo();
          maxEval = Math.max(maxEval, evalVal);
          alpha = Math.max(alpha, evalVal);
          if (beta <= alpha) break; // Prune branch
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let move of moves) {
          game.move(move);
          let evalVal = minimax(depth - 1, alpha, beta, true);
          game.undo();
          minEval = Math.min(minEval, evalVal);
          beta = Math.min(beta, evalVal);
          if (beta <= alpha) break; // Prune branch
        }
        return minEval;
      }
    }

    function makeAIMove() {
      const depth = parseInt(document.getElementById('ai-depth').value);
      const moves = game.moves();
      if (moves.length === 0) return;

      let bestMove = null;
      let bestValue = Infinity; // AI plays Black (minimizing)

      for (let move of moves) {
        game.move(move);
        let boardValue = minimax(depth - 1, -Infinity, Infinity, true);
        game.undo();

        if (boardValue < bestValue) {
          bestValue = boardValue;
          bestMove = move;
        }
      }

      game.move(bestMove);
      renderBoard();
      updateStatus();
    }

    function renderBoard() {
      const boardElement = document.getElementById('chess-board');
      boardElement.innerHTML = '';
      const board = game.board();

      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
          const squareDiv = document.createElement('div');
          const squareName = String.fromCharCode(97 + j) + (8 - i);
          squareDiv.className = `square ${(i + j) % 2 === 0 ? 'light' : 'dark'}`;
          squareDiv.dataset.square = squareName;

          if (selectedSquare === squareName) {
            squareDiv.classList.add('selected');
          }

          const piece = board[i][j];
          if (piece) {
            const imgKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
            const img = document.createElement('img');
            img.src = PIECE_SPRITES[imgKey];
            img.className = 'piece-img';
            squareDiv.appendChild(img);
          }

          squareDiv.onclick = () => handleSquareClick(squareName);
          boardElement.appendChild(squareDiv);
        }
      }
    }

    function handleSquareClick(square) {
      if (game.turn() !== 'w') return; // Wait for AI turn

      if (selectedSquare) {
        const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
        selectedSquare = null;
        if (move) {
          renderBoard();
          updateStatus();
          setTimeout(makeAIMove, 250);
          return;
        }
      }

      const piece = game.get(square);
      if (piece && piece.color === 'w') {
        selectedSquare = square;
      } else {
        selectedSquare = null;
      }
      renderBoard();
    }

    function updateStatus() {
      const status = document.getElementById('game-status');
      if (game.in_checkmate()) {
        status.textContent = game.turn() === 'w' ? 'Checkmate! Black wins.' : 'Checkmate! White wins.';
      } else if (game.in_draw()) {
        status.textContent = 'Game Over - Draw!';
      } else {
        status.textContent = game.turn() === 'w' ? 'Your turn (White)' : 'AI is thinking...';
      }
    }

    document.getElementById('reset-btn').onclick = () => {
      game.reset();
      selectedSquare = null;
      renderBoard();
      updateStatus();
    };

    renderBoard();
  </script>
</body>
</html>
