<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dojo Island | Virtual Room</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { margin: 0; background: #0b0f19; color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
    #islandCanvas { width: 100vw; height: 85vh; display: block; background: #0284c7; }
    
    .hud {
      height: 15vh; background: #151b28; border-top: 2px solid #a855f7; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; box-sizing: border-box;
    }
    .hud-player { display: flex; align-items: center; gap: 1rem; }
    .hud-avatar { width: 54px; height: 54px; border-radius: 50%; border: 2px solid #a855f7; background: #0b0f19; }
    
    .btn { background: #a855f7; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .btn-exit { background: #ef4444; margin-left: 8px; }
  </style>
</head>
<body>

  <canvas id="islandCanvas"></canvas>

  <div class="hud">
    <div class="hud-player">
      <img id="avatarImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=Explorer" class="hud-avatar">
      <div>
        <h3 style="margin:0;" id="hudName">Student Explorer</h3>
        <span style="color:#10b981; font-weight:800;" id="hudCoins">🪙 Dojo Coins: Loading...</span>
      </div>
    </div>

    <div>
      <button class="btn" onclick="customizeMonster()">🎨 Custom Avatar</button>
      <button class="btn btn-exit" onclick="exitIsland()">🚪 Return to Class</button>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'iifhzdioridrmbcflswa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZmh6ZGlvcmlkcm1iY2Zsc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjQ5MDUsImV4cCI6MjA5OTY0MDkwNX0.Pq5n0mIl-3lBli16OVrl-6fHZStv_V_y19izQJZT088';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const canvas = document.getElementById('islandCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.85;

    const session = JSON.parse(localStorage.getItem('dojo_session') || 'null');
    const classId = new URLSearchParams(window.location.search).get('classId') || 'CLASS101';

    if (!session) window.location.href = '/classrooms/login.html';

    let activeStudent = { name: "Explorer", points: 0 };

    async function initIslandPlayer() {
      if (session.role === 'student') {
        const { data } = await db
          .from('students')
          .select('*')
          .eq('id', session.studentId)
          .single();

        if (data) activeStudent = data;
      } else {
        activeStudent = { name: "Teacher / Owner", points: 999 };
      }

      document.getElementById('hudName').textContent = activeStudent.name;
      document.getElementById('hudCoins').textContent = `🪙 Dojo Coins: ${activeStudent.points}`;
      document.getElementById('avatarImg').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(activeStudent.name)}`;
    }

    initIslandPlayer();

    // 2D Canvas Game Loop
    let player = { x: canvas.width / 2, y: canvas.height / 2, r: 24, speed: 5 };
    let chest = { x: canvas.width / 2 + 120, y: canvas.height / 2 - 80, open: false };
    let keys = {};

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function gameLoop() {
      if (keys['w'] || keys['arrowup']) player.y -= player.speed;
      if (keys['s'] || keys['arrowdown']) player.y += player.speed;
      if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
      if (keys['d'] || keys['arrowright']) player.x += player.speed;

      player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
      player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Island Base
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 320, 0, Math.PI * 2);
      ctx.fill();

      // Check Treasure Chest Collision & Sync to Supabase
      const distToChest = Math.hypot(player.x - chest.x, player.y - chest.y);
      if (distToChest < 40 && !chest.open) {
        chest.open = true;
        activeStudent.points += 5;
        document.getElementById('hudCoins').textContent = `🪙 Dojo Coins: ${activeStudent.points}`;

        if (session.role === 'student') {
          db.from('students').update({ points: activeStudent.points }).eq('id', session.studentId);
        }
      }

      // Render Chest
      ctx.fillStyle = chest.open ? '#f59e0b' : '#78350f';
      ctx.fillRect(chest.x - 20, chest.y - 20, 40, 40);
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px sans-serif';
      ctx.fillText(chest.open ? 'OPEN (+5 pts!)' : 'Treasure Chest', chest.x - 35, chest.y - 28);

      // Render Player Character
      ctx.fillStyle = '#a855f7';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(activeStudent.name, player.x - 35, player.y - 32);

      requestAnimationFrame(gameLoop);
    }

    gameLoop();

    function customizeMonster() {
      const seed = prompt("Enter new Avatar seed name:");
      if (seed) {
        document.getElementById('avatarImg').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(seed)}`;
      }
    }

    function exitIsland() { window.history.back(); }
  </script>
</body>
</html>
