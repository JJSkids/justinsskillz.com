<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justin's Skillz - Admin Panel</title>

  <link rel="icon" type="image/jpeg" href="Justin's Skillz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="theme.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="bg-glow glow-top-left"></div>
  <div class="bg-glow glow-bottom-right"></div>

  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="logo">
        <img src="Justin's Skillz.jpg" alt="Justin's Skillz Logo" class="nav-logo-img">
        <span class="logo-text">JUSTIN'S <span class="gradient-text">SKILLZ</span> ADMIN</span>
      </a>

      <nav class="nav-menu">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="../AI.html" class="nav-link">AI Assistant</a>
        <a href="admin.html" class="nav-link active">Admin Panel</a>
      </nav>

      <div class="nav-actions" id="auth-actions">
        <!-- Dynamically loaded -->
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding: 2rem 1rem; max-width: 800px;">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800;">Admin Control Panel</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Manage broadcasts and system announcements.</p>
      </div>

      <div class="card" style="padding: 2rem; background: var(--bg-card); border: 2px solid var(--border-subtle); border-radius: var(--radius-lg); margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">📢 Broadcast Stream Control</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">Send a live announcement stream update to all connected users instantly.</p>
        
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <textarea id="broadcast-message" class="chat-input" placeholder="Type your broadcast announcement here..." rows="4" style="width: 100%; background: var(--bg-primary); border: 2px solid var(--border-subtle); color: var(--text-main); padding: 0.85rem; border-radius: var(--radius-md); font-family: inherit; resize: none;"></textarea>
          
          <div style="display: flex; justify-content: flex-end;">
            <button type="button" onclick="publishBroadcast()" class="btn btn-primary" style="background: var(--accent-purple); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer;">Publish Broadcast</button>
          </div>
        </div>
      </div>

      <div class="card" style="padding: 2rem; background: var(--bg-card); border: 2px solid var(--border-subtle); border-radius: var(--radius-lg);">
        <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;">Active Broadcast History</h3>
        <div id="broadcast-history" style="display: flex; flex-direction: column; gap: 0.75rem; max-height: 250px; overflow-y: auto;">
          <p style="color: var(--text-muted); font-size: 0.9rem;">Loading broadcasts...</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://iifhzdioridrmbcflswa.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZmh6ZGlvcmlkcm1iY2Zsc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjQ5MDUsImV4cCI6MjA5OTY0MDkwNX0.Pq5n0mIl-3lBli16OVrl-6fHZStv_V_y19izQJZT088';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkAdminAuth() {
      const authContainer = document.getElementById('auth-actions');
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        if (authContainer) {
          authContainer.innerHTML = `
            <button type="button" onclick="handleSignOut()" class="btn" style="background: var(--bg-primary); border: 2px solid var(--border-subtle); color: var(--text-main); padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 700; font-size: 0.85rem; cursor: pointer;">Sign Out</button>
          `;
        }
      } else {
        if (authContainer) {
          authContainer.innerHTML = `
            <a href="login.html" class="btn btn-primary" style="background: var(--accent-purple); color: white; padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 700; font-size: 0.85rem; text-decoration: none;">Sign In</a>
          `;
        }
      }
    }

    async function publishBroadcast() {
      const messageInput = document.getElementById('broadcast-message');
      const content = messageInput.value.trim();
      if (!content) return;

      try {
        const { error } = await supabase
          .from('broadcasts')
          .insert([{ content: content, created_at: new Date() }]);

        if (error) throw error;

        messageInput.value = '';
        alert('Broadcast published successfully!');
        loadBroadcastHistory();
      } catch (err) {
        alert('Error publishing broadcast: ' + err.message);
      }
    }

    async function loadBroadcastHistory() {
      const historyContainer = document.getElementById('broadcast-history');
      try {
        const { data, error } = await supabase
          .from('broadcasts')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(10);

        if (error) throw error;

        if (!data || data.length === 0) {
          historyContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No broadcasts sent yet.</p>';
          return;
        }

        historyContainer.innerHTML = data.map(item => `
          <div style="padding: 0.75rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-size: 0.9rem;">
            <p style="margin-bottom: 0.25rem;">${escapeHtml(item.content)}</p>
            <span style="font-size: 0.75rem; color: var(--text-muted);">${new Date(item.created_at).toLocaleString()}</span>
          </div>
        `).join('');
      } catch (err) {
        historyContainer.innerHTML = `<p style="color: #ef4444; font-size: 0.9rem;">Failed to load history.</p>`;
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    async function handleSignOut() {
      await supabase.auth.signOut();
      window.location.href = '../index.html';
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth();
      loadBroadcastHistory();
    });
  </script>
</body>
</html>
