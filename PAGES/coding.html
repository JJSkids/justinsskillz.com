<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code IDE | Justin's Skillz</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header class="nav-header">
        <a href="../dashboard.html" class="btn btn-primary">← Workspace Dashboard</a>
        <h2 style="margin: 0; font-size: 1.2rem; color: var(--accent-blue);">💻 Live Code IDE</h2>
    </header>

    <main class="container">
        <div class="card">
            <h1 style="margin-top: 0;">Interactive Front-End Workspace</h1>
            <p style="color: var(--text-muted);">Write HTML, CSS, and JS inline. Press <strong>Run Code</strong> to render instant output.</p>
            
            <textarea id="codeEditor" class="code-input" placeholder="Enter HTML/CSS here..."><h1 style="color: #38bdf8;">Hello, Developer!</h1>
<button onclick="alert('Running JavaScript!')">Test JS Alert</button></textarea>

            <button onclick="runCode()" class="btn btn-blue" style="margin-top: 1rem;">Run Code</button>

            <h3 style="margin-top: 2rem;">Live Output Preview</h3>
            <iframe id="previewFrame" style="width: 100%; height: 220px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px;"></iframe>
        </div>
    </main>

    <script>
      function runCode() {
        const code = document.getElementById('codeEditor').value;
        const frame = document.getElementById('previewFrame');
        frame.srcdoc = code;
      }
      window.onload = runCode;
    </script>
</body>
</html>
