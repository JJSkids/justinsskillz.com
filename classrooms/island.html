<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Development</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .glow {
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.25);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/20 via-slate-950 to-slate-950">

    <div class="glass-card glow max-w-md w-full rounded-3xl p-8 text-center space-y-6 relative overflow-hidden">
        <!-- Animated Background Accent -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-600/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-cyan-600/20 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Construction Icon -->
        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-purple-600 to-cyan-500 flex items-center justify-center text-3xl shadow-lg animate-bounce">
            🛠️
        </div>

        <!-- Heading & Message -->
        <div class="space-y-2">
            <h1 class="text-2xl font-extrabold tracking-tight text-white">Under Development</h1>
            <p class="text-slate-400 text-sm leading-relaxed">
                This section of the website is currently being built. Please go back to the main site.
            </p>
        </div>

        <!-- Back Button -->
        <a href="../index.html" class="inline-flex items-center justify-center gap-2 w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-sm hover:brightness-110 active:scale-[0.98] transition-all shadow-lg shadow-purple-600/25">
            <span>←</span> Go Back
        </a>

        <!-- Auto-redirect countdown indicator -->
        <p class="text-xs text-slate-500 font-medium">
            Redirecting automatically in <span id="countdown" class="text-purple-400 font-bold">10</span>s...
        </p>
    </div>

    <script>
        // Automatic redirect after 10 seconds
        let seconds = 10;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = '../index.html';
            }
        }, 1000);
    </script>
</body>
</html>
