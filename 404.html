<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in Space | Justin's Skillz</title>
  
  <link rel="icon" type="image/jpeg" href="Justin's Skillz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #06070c;
      --card-bg: rgba(15, 18, 28, 0.78);
      --border-subtle: rgba(168, 85, 247, 0.3);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --neon-glow: rgba(168, 85, 247, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      perspective: 1000px;
      user-select: none;
    }

    /* Interactive Space Canvas */
    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: crosshair;
    }

    /* Ambient Cosmic Nebula */
    .nebula {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(59, 130, 246, 0.12) 40%, transparent 70%);
      filter: blur(90px);
      z-index: 1;
      pointer-events: none;
      animation: pulseNebula 12s ease-in-out infinite alternate;
    }

    @keyframes pulseNebula {
      0% { transform: scale(0.85) translate(-15%, -10%); opacity: 0.6; }
      100% { transform: scale(1.25) translate(15%, 10%); opacity: 1; }
    }

    /* Adrift Astronaut Illustration */
    .astronaut-container {
      position: absolute;
      z-index: 2;
      width: 110px;
      height: 110px;
      top: 15%;
      left: 12%;
      animation: floatAstronaut 22s ease-in-out infinite alternate;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .astronaut-container:hover {
      transform: scale(1.2) rotate(15deg);
    }

    .astronaut-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6));
    }

    @keyframes floatAstronaut {
      0% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(120px, 80px) rotate(45deg); }
      66% { transform: translate(40px, 220px) rotate(-20deg); }
      100% { transform: translate(260px, 120px) rotate(90deg); }
    }

    /* Main Glass Card Container */
    .container {
      text-align: center;
      z-index: 3;
      padding: 2.8rem 2.4rem;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), 0 0 50px var(--neon-glow);
      margin: 1rem;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease, border-color 0.3s ease;
      position: relative;
    }

    .container:hover {
      border-color: rgba(236, 72, 153, 0.5);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 65px rgba(236, 72, 153, 0.35);
    }

    /* Glitch 404 Header */
    .error-code {
      font-size: 8.5rem;
      font-weight: 900;
      line-height: 0.95;
      position: relative;
      display: inline-block;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -4px;
      animation: float 4s ease-in-out infinite;
    }

    .error-code::before,
    .error-code::after {
      content: '404';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.8;
      clip: rect(0, 0, 0, 0);
    }

    .error-code:hover::before {
      animation: glitch-anim 0.35s infinite linear alternate-reverse;
    }

    .error-code:hover::after {
      animation: glitch-anim2 0.25s infinite linear alternate-reverse;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      margin: 1rem 0 0.5rem 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .timer-msg {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.65rem 1.25rem;
      border-radius: 99px;
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    #countdown {
      color: var(--accent-pink);
      font-weight: 800;
    }

    .actions {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      text-decoration: none;
      padding: 0.8rem 1.8rem;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.92rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.4);
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.65);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.08);
    }

    /* Top Control Bar */
    .top-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 0.6rem;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.55rem 0.95rem;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 0 12px var(--neon-glow);
    }

    /* Interactive Sci-Fi CLI Terminal Drawer */
    .terminal-drawer {
      position: fixed;
      bottom: -320px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 650px;
      height: 300px;
      background: rgba(8, 10, 18, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid var(--accent-purple);
      border-radius: 16px 16px 0 0;
      z-index: 20;
      padding: 1rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
    }

    .terminal-drawer.open {
      bottom: 0;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--accent-purple);
      font-weight: 600;
    }

    .terminal-output {
      flex: 1;
      overflow-y: auto;
      margin: 0.75rem 0;
      color: var(--accent-green);
      line-height: 1.5;
    }

    .terminal-input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .terminal-input-row span {
      color: var(--accent-pink);
    }

    .terminal-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
      width: 100%;
    }

    /* Keyframe Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes glitch-anim {
      0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.4deg); }
      50% { clip: rect(40px, 9999px, 15px, 0); transform: skew(-0.6deg) translateX(-3px); }
      100% { clip: rect(25px, 9999px, 50px, 0); transform: skew(0.3deg); }
    }

    @keyframes glitch-anim2 {
      0% { clip: rect(50px, 9999px, 20px, 0); transform: skew(-0.3deg) translateX(3px); }
      50% { clip: rect(10px, 9999px, 60px, 0); transform: skew(0.5deg); }
      100% { clip: rect(30px, 9999px, 10px, 0); transform: skew(-0.4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .error-code, .nebula, .astronaut-container { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="top-bar">
    <button class="icon-btn" id="sfx-btn" onclick="toggleAudio()">🔊 SFX: ON</button>
    <button class="icon-btn" id="synth-btn" onclick="toggleAmbientSynth()">🎵 Synth: OFF</button>
    <button class="icon-btn" onclick="toggleTerminal()">💻 Terminal</button>
  </div>

  <div class="nebula"></div>
  <canvas id="space-canvas"></canvas>

  <!-- Interactive Floating Astronaut -->
  <div class="astronaut-container" onclick="pokeAstronaut()" title="Click to interact!">
    <svg class="astronaut-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 8C21 8 16 16 16 26V38C16 48 21 56 32 56C43 56 48 48 48 38V26C48 16 43 8 32 8Z" fill="#F3F4F6"/>
      <path d="M32 14C23 14 20 18 20 25C20 32 23 35 32 35C41 35 44 32 44 25C44 18 41 14 32 14Z" fill="#1E1B4B"/>
      <path d="M24 20C24 20 28 17 34 20C36 21 38 24 38 24" stroke="#A855F7" stroke-width="2" stroke-linecap="round"/>
      <circle cx="20" cy="42" r="3" fill="#EC4899"/>
      <circle cx="44" cy="42" r="3" fill="#3B82F6"/>
    </svg>
  </div>

  <!-- Central Glass Card -->
  <main class="container" id="glass-card">
    <div class="error-code">404</div>
    <h1>Lost in Deep Space</h1>
    <p>The system parameters you requested have drifted out of physical space or were annihilated by a dark nebula.</p>
    
    <div class="timer-msg">
      ⚡ Hyper-jump protocol in <span id="countdown">10</span>s
    </div>

    <div class="actions">
      <button class="btn" onclick="initiateHyperjump()">Engage Hyper-Jump</button>
      <button id="pause-btn" class="btn btn-secondary" onclick="toggleTimer()">Pause Jump</button>
      <button class="btn btn-secondary" onclick="triggerSupernova()">Supernova</button>
    </div>
  </main>

  <!-- Interactive Terminal Drawer -->
  <div class="terminal-drawer" id="terminal-drawer">
    <div class="terminal-header">
      <span>[SYS.DIAGNOSTICS v4.0.4]</span>
      <span style="cursor:pointer;" onclick="toggleTerminal()">[X]</span>
    </div>
    <div class="terminal-output" id="terminal-output">
      Justin's Skillz Terminal initialized...<br>
      Type 'help' for available system commands.<br>
    </div>
    <div class="terminal-input-row">
      <span>&gt;</span>
      <input type="text" class="terminal-input" id="terminal-input" autocomplete="off" placeholder="Type command..." onkeydown="handleTerminalCommand(event)">
    </div>
  </div>

  <script>
    /* ===================================================
       1. SYNTHESIZED WEB AUDIO API (NO EXTERNAL FILES)
       =================================================== */
    let audioCtx = null;
    let sfxEnabled = true;
    let ambientSynthNode = null;
    let ambientGainNode = null;
    let isSynthPlaying = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleAudio() {
      sfxEnabled = !sfxEnabled;
      document.getElementById('sfx-btn').textContent = sfxEnabled ? "🔊 SFX: ON" : "🔇 SFX: OFF";
    }

    function playBeep(freq = 600, duration = 0.05, type = 'sine', vol = 0.04) {
      if (!sfxEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playShockwaveSound() {
      if (!sfxEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    function playWarpSound() {
      if (!sfxEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 1.2);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {}
    }

    // Generates an ambient sci-fi cosmic drone
    function toggleAmbientSynth() {
      initAudio();
      const synthBtn = document.getElementById('synth-btn');

      if (isSynthPlaying) {
        if (ambientGainNode) {
          ambientGainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
        }
        setTimeout(() => {
          if (ambientSynthNode) ambientSynthNode.stop();
          isSynthPlaying = false;
          synthBtn.textContent = "🎵 Synth: OFF";
        }, 500);
      } else {
        ambientSynthNode = audioCtx.createOscillator();
        ambientGainNode = audioCtx.createGain();
        
        ambientSynthNode.type = 'triangle';
        ambientSynthNode.frequency.setValueAtTime(55, audioCtx.currentTime); // Low A note
        
        // Modulate frequency slightly for space drone effect
        const lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.2;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 5;
        lfo.connect(ambientSynthNode.frequency);
        lfo.start();

        ambientGainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
        ambientGainNode.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 1);

        ambientSynthNode.connect(ambientGainNode);
        ambientGainNode.connect(audioCtx.destination);
        
        ambientSynthNode.start();
        isSynthPlaying = true;
        synthBtn.textContent = "🎵 Synth: ON";
      }
    }

    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('mouseenter', () => playBeep(800, 0.04, 'triangle'));
    });

    /* ===================================================
       2. CANVAS SPACE, EXPLOSIONS & SUPERNOVA ENGINE
       =================================================== */
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const numStars = 250;
    const stars = [];
    const particles = [];
    let isWarping = false;
    let starSpeed = 1.5;

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = Math.random() * width;
        this.pz = this.z;
        this.size = Math.random() * 1.5 + 0.5;
        this.color = ['#a855f7', '#3b82f6', '#ec4899', '#ffffff', '#10b981'][Math.floor(Math.random() * 5)];
      }

      update(speed) {
        this.pz = this.z;
        this.z -= speed;
        if (this.z <= 0) {
          this.reset();
          this.z = width;
          this.pz = this.z;
        }
      }

      draw() {
        const sx = (this.x / this.z) * (width / 2) + width / 2;
        const sy = (this.y / this.z) * (height / 2) + height / 2;

        const px = (this.x / this.pz) * (width / 2) + width / 2;
        const py = (this.y / this.pz) * (height / 2) + height / 2;

        if (sx < 0 || sx > width || sy < 0 || sy > height) return;

        ctx.strokeStyle = this.color;
        ctx.lineWidth = isWarping ? (1 - this.z / width) * 5 + 1 : this.size;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(sx, sy);
        ctx.stroke();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < numStars; i++) {
      stars.push(new Star());
    }

    // Spawn shockwave particles on user click anywhere
    canvas.addEventListener('click', (e) => {
      createExplosion(e.clientX, e.clientY, 25);
      playShockwaveSound();
    });

    function createExplosion(x, y, count = 30) {
      const colors = ['#a855f7', '#3b82f6', '#ec4899', '#10b981', '#ffffff'];
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
      }
    }

    function triggerSupernova() {
      createExplosion(width / 2, height / 2, 150);
      playShockwaveSound();
      printTerminal("WARNING: Supernova shockwave triggered at core.");
    }

    function renderSpace() {
      ctx.fillStyle = isWarping ? 'rgba(6, 7, 12, 0.25)' : 'rgba(6, 7, 12, 0.85)';
      ctx.fillRect(0, 0, width, height);

      if (isWarping) {
        starSpeed = Math.min(starSpeed * 1.08, 50);
      }

      stars.forEach(star => {
        star.update(starSpeed);
        star.draw();
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(renderSpace);
    }
    renderSpace();

    /* ===================================================
       3. 3D TILT EFFECT & INTERACTIVE ASTRONAUT
       =================================================== */
    const card = document.getElementById('glass-card');
    document.addEventListener('mousemove', (e) => {
      if (isWarping) return;
      const xAxis = (window.innerWidth / 2 - e.clientX) / 32;
      const yAxis = (window.innerHeight / 2 - e.clientY) / 32;
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
    });

    function pokeAstronaut() {
      playBeep(950, 0.1, 'sine', 0.1);
      setTimeout(() => playBeep(1200, 0.15, 'triangle', 0.1), 100);
      printTerminal("ASTRONAUT: 'Hey! Watch the suit pressure, space cadet!'");
    }

    /* ===================================================
       4. SCI-FI TERMINAL ENGINE
       =================================================== */
    const terminalDrawer = document.getElementById('terminal-drawer');
    const terminalOutput = document.getElementById('terminal-output');

    function toggleTerminal() {
      terminalDrawer.classList.toggle('open');
      playBeep(500, 0.05, 'square');
      if (terminalDrawer.classList.contains('open')) {
        document.getElementById('terminal-input').focus();
      }
    }

    function printTerminal(text) {
      terminalOutput.innerHTML += `${text}<br>`;
      terminalOutput.scrollTop = terminalOutput.scrollHeight;
    }

    function handleTerminalCommand(e) {
      if (e.key === 'Enter') {
        const input = e.target.value.trim().toLowerCase();
        e.target.value = '';
        if (!input) return;

        printTerminal(`&gt; ${input}`);
        playBeep(700, 0.03, 'sine');

        switch (input) {
          case 'help':
            printTerminal("Commands: 'scan', 'warp', 'home', 'ping', 'clear', 'synth', 'supernova'");
            break;
          case 'scan':
            printTerminal("Scanning... [!] 0 Lifeforms found. Deep space drift detected.");
            break;
          case 'warp':
            printTerminal("Initiating emergency hyper-jump...");
            initiateHyperjump();
            break;
          case 'home':
            window.location.href = "index.html";
            break;
          case 'ping':
            printTerminal("Pong! Latency: 0.004ms to Justin's Skillz server.");
            break;
          case 'synth':
            toggleAmbientSynth();
            break;
          case 'supernova':
            triggerSupernova();
            break;
          case 'clear':
            terminalOutput.innerHTML = '';
            break;
          default:
            printTerminal(`Command not recognized: '${input}'. Type 'help' for commands.`);
        }
      }
    }

    /* ===================================================
       5. KONAMI CODE EASTER EGG (↑ ↑ ↓ ↓ ← → ← → B A)
       =================================================== */
    const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let konamiIndex = 0;

    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === konamiCode[konamiIndex].toLowerCase()) {
        konamiIndex++;
        if (konamiIndex === konamiCode.length) {
          triggerSupernova();
          printTerminal("🌟 CHEAT UNLOCKED: GOD MODE ENABLED!");
          alert("🌟 SECRET UNLOCKED: Justin's Skillz God-Mode Activated!");
          konamiIndex = 0;
        }
      } else {
        konamiIndex = 0;
      }
    });

    /* ===================================================
       6. COUNTDOWN & HYPER-JUMP LOGIC
       =================================================== */
    let timeLeft = 10;
    let isPaused = false;
    const countdownElement = document.getElementById('countdown');
    const pauseBtn = document.getElementById('pause-btn');

    const interval = setInterval(() => {
      if (isPaused || isWarping) return;
      
      timeLeft--;
      countdownElement.textContent = timeLeft;
      playBeep(450, 0.03, 'sine');
      
      if (timeLeft <= 0) {
        clearInterval(interval);
        initiateHyperjump();
      }
    }, 1000);

    function toggleTimer() {
      isPaused = !isPaused;
      playBeep(350, 0.06, 'square');
      if (isPaused) {
        pauseBtn.textContent = "Resume Jump";
        pauseBtn.style.borderColor = "var(--accent-purple)";
        printTerminal("Hyper-jump timer paused.");
      } else {
        pauseBtn.textContent = "Pause Jump";
        pauseBtn.style.borderColor = "var(--border-subtle)";
        printTerminal("Hyper-jump timer resumed.");
      }
    }

    function initiateHyperjump() {
      if (isWarping) return;
      isWarping = true;
      playWarpSound();
      printTerminal("HYPER-JUMP ENGAGED! Goodbye cadet...");

      card.style.transition = 'transform 1.1s cubic-bezier(0.7, 0, 0.84, 0), opacity 0.8s ease';
      card.style.transform = 'scale(0.02) translateZ(-600px) rotateX(30deg)';
      card.style.opacity = '0';

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1100);
    }
  </script>
</body>
</html>
