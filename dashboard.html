<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Dashboard | Justin's Skillz</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

    <div class="dashboard-container">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit;">
                    <img src="Justin's Skillz.jpg" alt="Justin's Skillz Logo" style="width: 32px; height: 32px; border-radius: 6px; object-fit: cover; border: 1px solid #f59e0b;">
                    <span id="sidebarBrand" class="brand-title">Justin's Skillz</span>
                </a>
            </div>

            <nav class="sidebar-menu">
                <a href="index.html" class="menu-item">🏠 Home Landing</a>
                <a href="#compiler" class="menu-item active">💻 Code IDE</a>
                <a href="#events" class="menu-item">🔴 Live Sessions</a>
                <!-- Admin Portal Link (Hidden by default, unhidden for admin email) -->
                <a href="admin.html" id="adminPortalLink" class="menu-item admin-btn hidden" style="display: none; background: rgba(239, 68, 68, 0.15); color: #ef4444; font-weight: bold; border-left: 3px solid #ef4444;">
                    ⚡ Admin Portal
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="signOutBtn" class="btn-secondary-small" style="width: 100%; cursor: pointer;">Sign Out</button>
            </div>
        </aside>

        <!-- Main Workspace Area -->
        <main class="main-content">
            
            <!-- Top Bar Header -->
            <header class="top-bar">
                <div class="user-welcome">
                    <!-- Dynamic Greeting -->
                    <h1 style="font-size: 1.5rem; margin: 0; display: flex; align-items: center; gap: 0.5rem;">
                        👋 <span id="userGreeting">Developer</span>!
                    </h1>
                </div>
                <div class="top-actions">
                    <button id="themeButton" class="btn-text">🌙</button>
                </div>
            </header>

            <!-- Dashboard Content Grid -->
            <div class="content-grid">
                
                <!-- Live Events Feed & Video Frame -->
                <section id="events" class="widget-card live-widget">
                    <div class="widget-header">
                        <h2>🔴 Live Stream Feed</h2>
                        <span id="liveDot" class="status-dot"></span>
                    </div>
                    
                    <div id="streamOffline" class="stream-placeholder">
                        <p>No active live session currently streaming.</p>
                    </div>

                    <iframe id="liveFrame" class="live-frame hidden" allow="autoplay; camera; microphone" frameborder="0"></iframe>

                    <div class="notifications-section">
                        <h3>Upcoming Events</h3>
                        <div id="notificationsList" class="events-list">
                            <p style="font-size:0.85rem; color:#94a3b8; padding: 0.5rem;">Loading events...</p>
                        </div>
                    </div>
                </section>

                <!-- Embedded Compiler / IDE -->
                <section id="compiler" class="widget-card ide-widget">
                    <div class="widget-header">
                        <h2>💻 Interactive Code Sandbox</h2>
                        <button id="runCodeBtn" class="btn-primary-small">▶ Run Code</button>
                    </div>
                    
                    <div class="ide-container" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                        <textarea id="codeEditor" class="code-input" placeholder="<!-- Write HTML/CSS/JS here -->
<h1>Hello World!</h1>
<button onclick=&quot;alert('Working!')&quot;>Click Me</button>" style="width: 100%; height: 180px; font-family: monospace; padding: 0.75rem; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px;"></textarea>
                        
                        <div class="output-preview">
                            <h3 style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 0.5rem;">Preview Output</h3>
                            <iframe id="ideOutput" style="width: 100%; height: 200px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px;"></iframe>
                        </div>
                    </div>
                </section>

            </div>

        </main>
    </div>

    <script src="dashboard.js" defer></script>
</body>
</html>
