<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justin's Skillz - Sign In</title>
  
  <link rel="icon" type="image/jpeg" href="Justin's Skillz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .login-container {
      max-width: 450px;
      margin: 4rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .login-card {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      text-align: center;
    }
    .social-btn {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: transform 0.2s, background 0.2s;
      border: 2px solid var(--border-subtle);
      background: var(--bg-primary);
      color: var(--text-main);
      text-decoration: none;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent-purple);
    }
    .social-btn.google {
      background: #ffffff;
      color: #1f2937;
      border-color: #e5e7eb;
    }
    .social-btn.google:hover {
      background: #f3f4f6;
    }
    .social-btn.github {
      background: #24292e;
      color: #ffffff;
      border-color: #24292e;
    }
    .social-btn.github:hover {
      background: #1f2328;
    }
  </style>
</head>
<body>

  <div class="bg-glow glow-top-left"></div>
  <div class="bg-glow glow-bottom-right"></div>

  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="logo">
        <img src="Justin's Skillz.jpg" alt="Justin's Skillz Logo" class="nav-logo-img">
        <span class="logo-text">JUSTIN'S <span class="gradient-text">SKILLZ</span></span>
      </a>

      <nav class="nav-menu">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="chess.html" class="nav-link">Chess AI</a>
        <a href="math.html" class="nav-link">Math Lab</a>
      </nav>

      <div class="nav-actions" style="display: flex; gap: 0.75rem; align-items: center;">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
          <span class="theme-icon">🌙</span> Dark Mode
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="login-container">
      
      <div class="login-card">
        <div>
          <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Welcome <span class="gradient-text">Back</span></h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your Justin's Skillz dashboard</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 0.5rem;">
          <!-- Google Sign In Button -->
          <button type="button" onclick="signInWithGoogle()" class="social-btn google">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.9 6.4C.7 8.8 0 10.3 0 12s.7 3.2 1.9 5.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16c1.8 3.8 5.6 7 10.1 7z"/></svg>
            Sign in with Google
          </button>

          <!-- GitHub Sign In Button -->
          <button type="button" onclick="signInWithGithub()" class="social-btn github">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            Sign in with GitHub
          </button>
        </div>

        <div style="border-top: 1px solid var(--border-subtle); padding-top: 1rem; margin-top: 0.5rem;">
          <a href="../index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">&larr; Back to Home</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="app-footer">
    <div class="container footer-content">
      <p class="footer-text">&copy; 2026 Justin's Skillz. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Safe initialization avoiding name collision
    if (!window.mySupabaseInstance) {
      window.mySupabaseInstance = window.supabase.createClient(
        'https://iifhzdioridrmbcflswa.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZmh6ZGlvcmlkcm1iY2Zsc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjQ5MDUsImV4cCI6MjA5OTY0MDkwNX0.Pq5n0mIl-3lBli16OVrl-6fHZStv_V_y19izQJZT088'
      );
    }

    const getRedirectUrl = () => {
      const pathname = window.location.pathname;
      const parentDir = pathname.substring(0, pathname.lastIndexOf('/'));
      return window.location.origin + parentDir + '/dashboard.html';
    };

    window.signInWithGoogle = async function() {
      try {
        const { error } = await window.mySupabaseInstance.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: getRedirectUrl()
          }
        });
        if (error) alert('Google Sign-In Error: ' + error.message);
      } catch (err) {
        alert('Unexpected error: ' + err.message);
      }
    };

    window.signInWithGithub = async function() {
      try {
        const { error } = await window.mySupabaseInstance.auth.signInWithOAuth({
          provider: 'github',
          options: {
            redirectTo: getRedirectUrl()
          }
        });
        if (error) alert('GitHub Sign-In Error: ' + error.message);
      } catch (err) {
        alert('Unexpected error: ' + err.message);
      }
    };
  </script>
</body>
</html>
