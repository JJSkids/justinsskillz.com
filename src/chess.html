  <link rel="preload" as="image" href="https://chessboardjs.com/img/chesspieces/wikipedia/wB.png">
  <link rel="preload" as="image" href="https://chessboardjs.com/img/chesspieces/wikipedia/wR.png">

  <style>
    :root, [data-theme="dark"] {
      --bg-primary: #0f1117;
      --bg-card: #181b25;
      --border-subtle: #2d3242;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --header-bg: rgba(15, 17, 23, 0.85);
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --border-subtle: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-purple: #9333ea;
      --accent-blue: #2563eb;
      --accent-green: #059669;
      --header-bg: rgba(248, 250, 252, 0.85);
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .app-header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1.5rem;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.1rem;
    }
    .nav-logo-img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-purple);
    }
    .gradient-text {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-menu {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
    }
    .main-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .chess-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .chess-layout {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }
    #myBoard {
      width: 400px;
      max-width: 100%;
    }
    .chess-sidebar {
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-primary {
      background: var(--accent-purple);
      color: white;
    }
    .btn-secondary {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
    }
    .status-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      padding: 1rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .lang-select-group {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .lang-select {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.4rem 0.6rem;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-family: inherit;
    }
    .lang-select:focus {
      outline: none;
      border-color: var(--accent-purple);
    }
    .app-footer {
      border-top: 1px solid var(--border-subtle);
      padding: 2rem 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="logo">
        <img src="../Justin's Skillz.jpg" alt="Justin's Skillz Logo" class="nav-logo-img">
        <span class="logo-text">JUSTIN'S <span class="gradient-text">SKILLZ</span></span>
      </a>

      <nav class="nav-menu">
        <a href="../index.html" class="nav-link" id="nav-home">Home</a>
        <a href="dashboard.html" class="nav-link" id="nav-dashboard">Dashboard</a>
        <a href="live.html" class="nav-link" style="color: var(--accent-green); font-weight: 700;">🔴 Live Stream</a>
        <a href="chess.html" class="nav-link active" style="color: var(--accent-purple);" id="nav-chess">Chess AI</a>
        <a href="math.html" class="nav-link" id="nav-math">Math Lab</a>
        <a href="../AI.html" class="nav-link" id="nav-ai">AI Assistant</a>
        <a id="nav-admin-link" href="admin.html" class="nav-link" style="display: none;">Admin</a>
      </nav>

      <div class="nav-actions" style="display: flex; gap: 0.75rem; align-items: center;">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme" style="background: transparent; border: none; cursor: pointer; font-size: 1.1rem;">
          🌙
        </button>
        <div id="auth-action-container">
          <a href="login.html" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem; text-decoration: none;">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="chess-card">
      <h2 id="chess-title" style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.75rem; text-align: center;">Chess AI Training Lab</h2>
      
      <div class="chess-layout">
        <div id="myBoard"></div>
        
        <div class="chess-sidebar">
          <div class="lang-select-group">
            <label for="langSelect" id="lang-label" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Language / Langue / Idioma</label>
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
              <option value="en">English</option>
              <option value="fr">Français</option>
              <option value="es">Español</option>
            </select>
          </div>

          <div class="status-box">
            <strong id="status-label">Game Status:</strong><br>
            <span id="status">Turn: White</span><br>
            <span id="fen" style="font-size: 0.75rem; color: var(--text-muted); word-break: break-all;"></span>
          </div>

          <button type="button" id="startBtn" class="btn btn-primary">New Game</button>
          <button type="button" id="undoBtn" class="btn btn-secondary">Undo Move</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 Justin's Skillz. Created and owned by Justin Emuekhare. All rights reserved.</p>
  </footer>

  <script>
    if (!window.mySupabaseInstance) {
      window.mySupabaseInstance = window.supabase.createClient(
        'https://iifhzdioridrmbcflswa.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZmh6ZGlvcmlkcm1iY2Zsc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjQ5MDUsImV4cCI6MjA5OTY0MDkwNX0.Pq5n0mIl-3lBli16OVrl-...'
      );
    }

    const ADMIN_EMAIL = 'hellojjskids@gmail.com';

    const translations = {
      en: {
        title: "Chess AI Training Lab",
        statusGame: "Game Status:",
        newGame: "New Game",
        undoBtn: "Undo Move",
        navHome: "Home",
        navDashboard: "Dashboard",
        navChess: "Chess AI",
        navMath: "Math Lab",
        navAI: "AI Assistant",
        signIn: "Sign In",
        signOut: "Sign Out",
        langLabel: "Language / Langue / Idioma"
      },
      fr: {
        title: "Laboratoire d'Entraînement IA d'Échecs",
        statusGame: "État du Jeu :",
        newGame: "Nouvelle Partie",
        undoBtn: "Annuler le Coup",
        navHome: "Accueil",
        navDashboard: "Tableau de bord",
        navChess: "IA d'Échecs",
        navMath: "Labo de Math",
        navAI: "Assistant IA",
        signIn: "Se connecter",
        signOut: "Se déconnecter",
        langLabel: "Langue / Language / Idioma"
      },
      es: {
        title: "Laboratorio de IA de Ajedrez",
        statusGame: "Estado del Juego:",
        newGame: "Nueva Partida",
        undoBtn: "Deshacer Movimiento",
        navHome: "Inicio",
        navDashboard: "Panel",
        navChess: "IA de Ajedrez",
        navMath: "Lab de Matemáticas",
        navAI: "Asistente IA",
        signIn: "Iniciar Sesión",
        signOut: "Cerrar Sesión",
        langLabel: "Idioma / Language / Langue"
      }
    };

    let currentGameInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      checkUserSession();
      const savedLang = localStorage.getItem('site_lang') || 'en';
      document.getElementById('langSelect').value = savedLang;
      applyLanguage(savedLang);
      currentGameInstance = initChessGame();
    });

    function changeLanguage(lang) {
      localStorage.setItem('site_lang', lang);
      applyLanguage(lang);
      if (currentGameInstance && typeof currentGameInstance.updateStatus === 'function') {
        currentGameInstance.updateStatus();
      }
    }

    function applyLanguage(lang) {
      const t = translations[lang];
      document.getElementById('chess-title').textContent = t.title;
      document.getElementById('status-label').textContent = t.statusGame;
      document.getElementById('startBtn').textContent = t.newGame;
      document.getElementById('undoBtn').textContent = t.undoBtn;
      document.getElementById('nav-home').textContent = t.navHome;
      document.getElementById('nav-dashboard').textContent = t.navDashboard;
      document.getElementById('nav-chess').textContent = t.navChess;
      document.getElementById('nav-math').textContent = t.navMath;
      document.getElementById('nav-ai').textContent = t.navAI;
      document.getElementById('lang-label').textContent = t.langLabel;
    }

    async function checkUserSession() {
      const { data: { session } } = await window.mySupabaseInstance.auth.getSession();
      const authContainer = document.getElementById('auth-action-container');
      const navAdminLink = document.getElementById('nav-admin-link');
      const lang = localStorage.getItem('site_lang') || 'en';
      const t = translations[lang];

      if (session && session.user) {
        authContainer.innerHTML = `
          <button type="button" onclick="handleSignOut()" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">${t.signOut}</button>
        `;
        const userEmail = session.user.email ? session.user.email.toLowerCase() : '';
        if (userEmail === ADMIN_EMAIL && navAdminLink) {
          navAdminLink.style.display = 'block';
        }
      } else {
        authContainer.innerHTML = `
          <a href="login.html" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem; text-decoration: none;">${t.signIn}</a>
        `;
      }
    }

    async function handleSignOut() {
      await window.mySupabaseInstance.auth.signOut();
      window.location.reload();
    }

    function initChessGame() {
      var board = null;
      var game = new Chess();
      var statusEl = $('#status');
      var fenEl = $('#fen');

      function onDragStart (source, piece, position, orientation) {
        if (game.game_over()) return false;
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }
      }

      function makeRandomMove() {
        var possibleMoves = game.moves();
        if (possibleMoves.length === 0) return;

        var randomIdx = Math.floor(Math.random() * possibleMoves.length);
        game.move(possibleMoves[randomIdx]);
        board.position(game.fen());
        updateStatus();
      }

      function onDrop (source, target) {
        var move = game.move({
          from: source,
          to: target,
          promotion: 'q'
        });

        if (move === null) return 'snapback';

        updateStatus();

        // Automatically trigger AI move after a brief delay
        if (!game.game_over()) {
          window.setTimeout(makeRandomMove, 250);
        }
      }

      function onSnapEnd () {
        board.position(game.fen());
      }

      function updateStatus () {
        var currentLang = localStorage.getItem('site_lang') || 'en';
        var status = '';
        var whiteLabel = currentLang === 'fr' ? 'les Blancs' : currentLang === 'es' ? 'Blancas' : 'White';
        var blackLabel = currentLang === 'fr' ? 'les Noirs' : currentLang === 'es' ? 'Negras' : 'Black';
        var colorKey = game.turn() === 'b' ? blackLabel : whiteLabel;

        if (game.in_checkmate()) {
          if (currentLang === 'fr') status = `Partie terminée, ${colorKey} est en échec et mat.`;
          else if (currentLang === 'es') status = `Fin del juego, ${colorKey} está en jaque mate.`;
          else status = `Game over, ${colorKey} is in checkmate.`;
        } else if (game.in_draw()) {
          if (currentLang === 'fr') status = "Partie terminée, position nulle.";
          else if (currentLang === 'es') status = "Fin del juego, tablas.";
          else status = "Game over, drawn position.";
        } else {
          if (currentLang === 'fr') {
            status = game.turn() === 'w' ? "Aux Blancs de jouer" : "Aux Noirs de jouer";
            if (game.in_check()) status += " (en échec)";
          } else if (currentLang === 'es') {
            status = game.turn() === 'w' ? "Turno de Blancas" : "Turno de Negras";
            if (game.in_check()) status += " (en jaque)";
          } else {
            status = (game.turn() === 'w' ? 'White' : 'Black') + ' to move';
            if (game.in_check()) status += ', check';
          }
        }

        statusEl.html(status);
        fenEl.html(game.fen());
      }

      var config = {
        position: 'start',
        draggable: true,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };

      board = Chessboard('myBoard', config);
      updateStatus();

      $('#startBtn').off('click').on('click', function () {
        game.reset();
        board.start();
        updateStatus();
      });

      $('#undoBtn').off('click').on('click', function () {
        game.undo();
        game.undo();
        board.position(game.fen());
        updateStatus();
      });

      return {
        updateStatus: updateStatus
      };
    }
  </script>
</body>
</html>
