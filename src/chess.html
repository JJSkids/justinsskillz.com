    :root, [data-theme="dark"] {

      --border-subtle: #2d3242;

    [data-theme="light"] {

      --bg-card: #ffffff;
      --border-subtle: #e2e8f0;
      --text-main: #1e293b;

      --accent-purple: #9333ea;

      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease;

    .app-header {

      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;

      padding: 0.75rem 1.5rem;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);

      font-size: 1.1rem;

    .nav-logo-img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-purple);
    }
    .gradient-text {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-menu {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
    }
    .main-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .chess-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .chess-layout {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }
    #myBoard {
      width: 400px;
      max-width: 100%;
    }
    .chess-sidebar {
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-primary {
      background: var(--accent-purple);
      color: white;
    }
    .btn-secondary {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
    }
    .status-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);

      border-radius: var(--radius-md);
      font-size: 0.95rem;

  <script>
    if (!window.mySupabaseInstance) {
      window.mySupabaseInstance = window.supabase.createClient(

        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZmh6ZGlvcmlkcm1iY2Zsc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjQ5MDUsImV4cCI6MjA5OTY0MDkwNX0.Pq5n0mIl-3lBli16OVrl-6fHZStv_V_y19izQJZT088'
      );
    }

    const ADMIN_EMAIL = 'hellojjskids@gmail.com';

    window.addEventListener('DOMContentLoaded', () => {
      checkUserSession();
      initChessGame();
    });

    async function checkUserSession() {
      const { data: { session } } = await window.mySupabaseInstance.auth.getSession();
      const authContainer = document.getElementById('auth-action-container');
      const navAdminLink = document.getElementById('nav-admin-link');

      if (session && session.user) {
        authContainer.innerHTML = `
          <button type="button" onclick="handleSignOut()" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">Sign Out</button>
        `;
        const userEmail = session.user.email ? session.user.email.toLowerCase() : '';
        if (userEmail === ADMIN_EMAIL && navAdminLink) {
          navAdminLink.style.display = 'block';
        }
      } else {
        authContainer.innerHTML = `
          <a href="login.html" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem; text-decoration: none;">Sign In</a>
        `;
      }
    }

    async function handleSignOut() {
      await window.mySupabaseInstance.auth.signOut();
      window.location.reload();
    }

    function initChessGame() {
      var board = null;
      var game = new Chess();
      var statusEl = $('#status');
      var fenEl = $('#fen');

      function onDragStart (source, piece, position, orientation) {
        if (game.game_over()) return false;
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }
      }

      function makeRandomMove() {
        var possibleMoves = game.moves();
        if (possibleMoves.length === 0) return;

        var randomIdx = Math.floor(Math.random() * possibleMoves.length);
        game.move(possibleMoves[randomIdx]);
        board.position(game.fen());
        updateStatus();
      }

      function onDrop (source, target) {
        var move = game.move({
          from: source,
          to: target,
          promotion: 'q'
        });

        if (move === null) return 'snapback';

        updateStatus();

        if (!game.game_over()) {
          window.setTimeout(makeRandomMove, 250);
        }
      }

      function onSnapEnd () {
        board.position(game.fen());
      }

      function updateStatus () {
        var status = '';
        var moveColor = 'White';
        if (game.turn() === 'b') {
          moveColor = 'Black';
        }

        if (game.in_checkmate()) {
          status = 'Game over, ' + moveColor + ' is in checkmate.';
        } else if (game.in_draw()) {
          status = 'Game over, drawn position';
        } else {
          status = moveColor + ' to move';
          if (game.in_check()) {
            status += ', ' + moveColor + ' is in check';
          }
        }

        statusEl.html(status);
        fenEl.html(game.fen());
      }

      var config = {
        position: 'start',
        draggable: true,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };

      board = Chessboard('myBoard', config);
      updateStatus();

      $('#startBtn').on('click', function () {
        game.reset();
        board.start();
        updateStatus();
      });

      $('#undoBtn').on('click', function () {
        game.undo();
        game.undo();
        board.position(game.fen());
        updateStatus();
      });
    }
  </script>
