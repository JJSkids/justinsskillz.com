<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic & Scripting | Justin's Skillz</title>
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;">
    <header style="padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
        <a href="../dashboard.html" style="color: #f59e0b; text-decoration: none; font-weight: bold;">← Back to Workspace</a>
        <h2 style="margin: 0; font-size: 1.2rem; color: #34d399;">🤖 Logic & Firmware Scripting</h2>
    </header>
    <main style="max-width: 1000px; margin: 2rem auto; padding: 0 1rem;">
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem;">
            <h1 style="color: #fff; margin-top: 0;">Redstone & Hardware Logic Simulator</h1>
            <p style="color: #94a3b8;">Interactive logic gate behavior testing zone.</p>
            <div style="display: flex; gap: 1rem; align-items: center; background: #0f172a; padding: 1.5rem; border-radius: 8px;">
                <label style="color: #fff;"><input type="checkbox" id="gateA"> Signal Input A</label>
                <label style="color: #fff;"><input type="checkbox" id="gateB"> Signal Input B</label>
                <button onclick="const a = document.getElementById('gateA').checked; const b = document.getElementById('gateB').checked; document.getElementById('gateOut').innerText = 'AND Output: ' + (a && b ? 'HIGH (1) ⚡' : 'LOW (0)');" style="padding: 0.5rem 1rem; background: #34d399; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Evaluate Gate</button>
            </div>
            <p id="gateOut" style="margin-top: 1rem; font-weight: bold; color: #f59e0b;">AND Output: LOW (0)</p>
        </div>
    </main>
</body>
</html>
