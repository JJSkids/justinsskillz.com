<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Arena - Justin's Skillz</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- App Header -->
    <header class="app-header">
        <div class="header-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">♟️</span>
                <span>Justin's Skillz</span>
            </a>
            <nav class="nav-menu">
                <a href="dashboad.html" class="nav-link">Dashboard</a>
                <a href="chess.html" class="nav-link active">Chess Arena</a>
            </nav>
            <div class="nav-actions">
                <button class="theme-toggle-btn" id="themeToggle">
                    <span>🌙</span> <span id="themeText">Dark</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <h1 class="dashboard-title">Chess Arena</h1>
            <p class="dashboard-subtitle">Test your strategy, analyze tactical lines, and play right on the board.</p>
            
            <div class="card" style="display: flex; flex-direction: column; align-items: center;">
                <div class="chess-layout">
                    <!-- Real 8x8 Chess Grid Container for Piece Placement -->
                    <div class="chess-board" id="chessBoard">
                        <!-- Rank 8 -->
                        <div class="square light" data-square="a8">∜</div>
                        <div class="square dark" data-square="b8">♞</div>
                        <div class="square light" data-square="c8">♝</div>
                        <div class="square dark" data-square="d8">♛</div>
                        <div class="square light" data-square="e8">♚</div>
                        <div class="square dark" data-square="f8">♝</div>
                        <div class="square light" data-square="g8">♞</div>
                        <div class="square dark" data-square="h8">∜</div>
                        
                        <!-- Rank 7 -->
                        <div class="square dark" data-square="a7">♟</div>
                        <div class="square light" data-square="b7">♟</div>
                        <div class="square dark" data-square="c7">♟</div>
                        <div class="square light" data-square="d7">♟</div>
                        <div class="square dark" data-square="e7">♟</div>
                        <div class="square light" data-square="f7">♟</div>
                        <div class="square dark" data-square="g7">♟</div>
                        <div class="square light" data-square="h7">♟</div>

                        <!-- Ranks 6 to 3 (Empty Squares with alternating patterns) -->
                        <!-- Rank 6 -->
                        <div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div>
                        <!-- Rank 5 -->
                        <div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div>
                        <!-- Rank 4 -->
                        <div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div>
                        <!-- Rank 3 -->
                        <div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div>

                        <!-- Rank 2 -->
                        <div class="square light" data-square="a2">♙</div>
                        <div class="square dark" data-square="b2">♙</div>
                        <div class="square light" data-square="c2">♙</div>
                        <div class="square dark" data-square="d2">♙</div>
                        <div class="square light" data-square="e2">♙</div>
                        <div class="square dark" data-square="f2">♙</div>
                        <div class="square light" data-square="g2">♙</div>
                        <div class="square dark" data-square="h2">♙</div>

                        <!-- Rank 1 -->
                        <div class="square dark" data-square="a1">♖</div>
                        <div class="square light" data-square="b1">♘</div>
                        <div class="square dark" data-square="c1">♗</div>
                        <div class="square light" data-square="d1">♕</div>
                        <div class="square dark" data-square="e1">♔</div>
                        <div class="square light" data-square="f1">♗</div>
                        <div class="square dark" data-square="g1">♘</div>
                        <div class="square light" data-square="h1">♖</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
        <div class="container">
            <p class="footer-text">&copy; 2026 Justin's Skillz. Built for peak performance.</p>
        </div>
    </footer>
</body>
</html>
