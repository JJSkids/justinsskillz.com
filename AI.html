<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justin's AI Assistant</title>

  <link rel="icon" type="image/jpeg" href="src/Justin's Skillz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles.css">
  <script src="src/theme.js" defer></script>

  <style>
    .chat-wrapper {
      max-width: 900px;
      margin: 1.5rem auto;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 160px);
      min-height: 550px;
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .chat-header {
      padding: 1.25rem 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 2px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-title-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .ai-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-purple), #3b82f6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }
    .message {
      display: flex;
      gap: 1rem;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      margin-left: auto;
      flex-direction: row-reverse;
    }
    .message-bubble {
      padding: 1rem 1.25rem;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .message.assistant .message-bubble {
      background: var(--bg-primary);
      border: 2px solid var(--border-subtle);
      color: var(--text-main);
      border-top-left-radius: 4px;
    }
    .message.user .message-bubble {
      background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
      color: white;
      border-top-right-radius: 4px;
    }
    .chat-input-area {
      padding: 1.25rem 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border-top: 2px solid var(--border-subtle);
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      background: var(--bg-primary);
      border: 2px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      max-height: 120px;
    }
    .chat-input:focus {
      outline: none;
      border-color: var(--accent-purple);
    }
    .send-btn {
      background: var(--accent-purple);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .send-btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }
    .config-btn {
      background: var(--bg-primary);
      border: 2px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .typing-indicator span {
      height: 8px;
      width: 8px;
      float: left;
      margin: 0 2px;
      background-color: var(--text-muted);
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.3s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
    .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <div class="bg-glow glow-top-left"></div>
  <div class="bg-glow glow-bottom-right"></div>

  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="src/Justin's Skillz.jpg" alt="Justin's Skillz Logo" class="nav-logo-img">
        <span class="logo-text">JUSTIN'S <span class="gradient-text">SKILLZ</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="src/dashboard.html" class="nav-link">Dashboard</a>
        <a href="AI.html" class="nav-link active">AI Assistant</a>
        <a href="src/chess.html" class="nav-link">Chess AI</a>
        <a href="src/math.html" class="nav-link">Math Lab</a>
        <a href="src/admin.html" class="nav-link">Admin</a>
      </nav>

      <div class="nav-actions">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
          <span class="theme-icon">🌙</span> Dark Mode
        </button>
      </div>
    </div>
  </header>

  <main class="main-content" style="padding-top: 1rem; padding-bottom: 1rem;">
    <div class="container">
      
      <div class="chat-wrapper">
        <div class="chat-header">
          <div class="chat-title-area">
            <div class="ai-avatar">🤖</div>
            <div>
              <h3 style="font-size: 1.1rem; font-weight: 700;">Justin's AI Collaborator</h3>
              <p style="font-size: 0.8rem; color: var(--text-muted);">Ready to chat instantly</p>
            </div>
          </div>
          <button type="button" class="config-btn" onclick="configureApiKey()">⚙️ API Key</button>
        </div>

        <div id="chat-messages" class="chat-messages">
          <div class="message assistant">
            <div class="ai-avatar" style="width: 32px; height: 32px; font-size: 0.9rem;">🤖</div>
            <div class="message-bubble">
              Hello! I'm your custom AI collaborator. Click the ⚙️ API Key button above to set your OpenAI API key, then start chatting!
            </div>
          </div>
        </div>

        <div class="chat-input-area">
          <textarea id="user-input" class="chat-input" placeholder="Type your message here... (Press Enter to send)" rows="1" onkeydown="handleKeydown(event)"></textarea>
          <button type="button" class="send-btn" onclick="sendMessage()" aria-label="Send Message">📤</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    const OPENAI_MODEL = "gpt-4o-mini";

    let chatHistory = [
      { role: "system", content: "You are Justin's personal AI collaborator, integrated into Justin's Skillz web app. Be warm, highly capable, concise, and helpful with programming, math, and daily learning." }
    ];

    function getApiKey() {
      return localStorage.getItem('openai_api_key') || '';
    }

    function configureApiKey() {
      const currentKey = getApiKey();
      const newKey = prompt("Enter your OpenAI API Key (stored securely in your browser's localStorage):", currentKey);
      if (newKey !== null) {
        localStorage.setItem('openai_api_key', newKey.trim());
        alert("API Key saved successfully!");
      }
    }

    function handleKeydown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const text = inputEl.value.trim();
      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        appendMessage('assistant', '⚠️ Please click the ⚙️ API Key button in the top right to configure your OpenAI API key before chatting.');
        return;
      }

      inputEl.value = '';
      appendMessage('user', text);
      chatHistory.push({ role: 'user', content: text });

      const typingId = appendTypingIndicator();

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: OPENAI_MODEL,
            messages: chatHistory
          })
        });

        removeTypingIndicator(typingId);

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'Failed to communicate with OpenAI API.');
        }

        const data = await response.json();
        const assistantReply = data.choices[0].message.content;

        chatHistory.push({ role: 'assistant', content: assistantReply });
        appendMessage('assistant', assistantReply);

      } catch (err) {
        removeTypingIndicator(typingId);
        appendMessage('assistant', `⚠️ Error: ${err.message}. Please verify your API key.`);
      }
    }

    function appendMessage(sender, text) {
      const container = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;

      if (sender === 'assistant') {
        msgDiv.innerHTML = `
          <div class="ai-avatar" style="width: 32px; height: 32px; font-size: 0.9rem;">🤖</div>
          <div class="message-bubble">${escapeHtml(text)}</div>
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="message-bubble">${escapeHtml(text)}</div>
        `;
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function appendTypingIndicator() {
      const container = document.getElementById('chat-messages');
      const id = 'typing-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.className = 'message assistant';
      div.innerHTML = `
        <div class="ai-avatar" style="width: 32px; height: 32px; font-size: 0.9rem;">🤖</div>
        <div class="message-bubble">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return id;
    }

    function removeTypingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/\n/g, "<br>");
    }
  </script>
</body>
</html>
