<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic & Scripting | Justin's Skillz</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="nav-header">
        <a href="../dashboard.html" class="btn btn-primary">← Workspace Dashboard</a>
        <h2 style="margin: 0; font-size: 1.2rem; color: var(--accent-green);">🤖 Logic & Firmware Scripting</h2>
    </header>

    <main class="container">
        <div class="card">
            <h1 style="margin-top: 0;">Interactive Logic Gate Simulator</h1>
            <p style="color: var(--text-muted);">Toggle input signals to evaluate logic gates in real-time:</p>
            
            <div style="background: var(--bg-main); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 1rem;">
                <div style="display: flex; gap: 1.5rem; align-items: center;">
                    <label><input type="checkbox" id="inA" onchange="evaluateLogic()"> Signal Input A</label>
                    <label><input type="checkbox" id="inB" onchange="evaluateLogic()"> Signal Input B</label>
                </div>
                
                <div>
                    <label for="gateSelect">Select Gate: </label>
                    <select id="gateSelect" onchange="evaluateLogic()" class="input-field" style="background: var(--bg-card);">
                        <option value="AND">AND Gate</option>
                        <option value="OR">OR Gate</option>
                        <option value="XOR">XOR Gate</option>
                        <option value="NAND">NAND Gate</option>
                    </select>
                </div>
            </div>

            <div id="logicResult" class="result-box" style="color: var(--accent-gold);">
                Output Signal: LOW (0)
            </div>
        </div>
    </main>

    <script>
      function evaluateLogic() {
        const a = document.getElementById('inA').checked;
        const b = document.getElementById('inB').checked;
        const gate = document.getElementById('gateSelect').value;
        let res = false;

        if (gate === 'AND') res = a && b;
        else if (gate === 'OR') res = a || b;
        else if (gate === 'XOR') res = (a && !b) || (!a && b);
        else if (gate === 'NAND') res = !(a && b);

        const out = document.getElementById('logicResult');
        out.innerHTML = `Output Signal: <strong>${res ? 'HIGH (1) ⚡' : 'LOW (0)'}</strong>`;
        out.style.color = res ? '#34d399' : '#f59e0b';
      }
    </script>
</body>
</html>
