<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justin's Skillz</title>
  
  <link rel="icon" type="image/jpeg" href="src/Justin's Skillz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="src/styles.css">
  <script src="src/theme.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="bg-glow glow-top-left"></div>
  <div class="bg-glow glow-bottom-right"></div>

  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="src/Justin's Skillz.jpg" alt="Justin's Skillz Logo" class="nav-logo-img">
        <span class="logo-text">JUSTIN'S <span class="gradient-text">SKILLZ</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="src/dashboard.html" class="nav-link">Dashboard</a>
        <a href="src/chess.html" class="nav-link">Chess AI</a>
        <a href="src/math.html" class="nav-link">Math Lab</a>
        <a href="src/admin.html" class="nav-link admin-nav-item" style="display: none; color: var(--accent-purple);">Admin</a>
      </nav>

      <div class="nav-actions" style="display: flex; gap: 0.75rem; align-items: center;">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
          <span class="theme-icon">🌙</span> Dark Mode
        </button>
        
        <div id="auth-btn-container">
          <a href="src/login.html" class="btn" style="background: var(--bg-primary); border: 2px solid var(--border-subtle); color: var(--text-main); padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 700; font-size: 0.85rem; text-decoration: none;">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="margin-top: 3rem; text-align: center;">
      <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 1rem;">Welcome to <span class="gradient-text">Justin's Skillz</span></h1>
      <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 2rem auto;">Explore coding projects, interactive math tools, and chess AI built with passion.</p>
      
      <div style="display: flex; justify-content: center; gap: 1rem;">
        <a href="src/dashboard.html" class="btn btn-primary" style="background: var(--accent-purple); color: white; padding: 0.75rem 1.5rem; border-radius: var(--radius-md); text-decoration: none; font-weight: 700;">Go to Dashboard</a>
      </div>
    </div>
  </main>

  <footer class="app-footer" style="margin-top: 5rem;">
    <div class="container footer-content">
      <p class="footer-text">&copy; 2026 Justin's Skillz. All rights reserved.</p>
    </div>
  </footer>

  <script>
    if (!window.mySupabaseInstance) {
      window.mySupabaseInstance = window.supabase.createClient(
        'https://iifhzdioridrmbcflswa.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZmh6ZGlvcmlkcm1iY2Zsc3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjQ5MDUsImV4cCI6MjA5OTY0MDkwNX0.Pq5n0mIl-3lBli16OVrl-6fHZStv_V_y19izQJZT088'
      );
    }

    const ADMIN_EMAILS = ['hellojjskids@gmail.com'];

    async function checkUserStatus() {
      const { data: { session } } = await window.mySupabaseInstance.auth.getSession();
      const authContainer = document.getElementById('auth-btn-container');

      if (session && session.user) {
        authContainer.innerHTML = `
          <button type="button" onclick="handleSignOut()" class="btn" style="background: var(--bg-primary); border: 2px solid var(--border-subtle); color: var(--text-main); padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 700; font-size: 0.85rem; cursor: pointer;">Sign Out</button>
        `;

        const userEmail = session.user.email ? session.user.email.toLowerCase() : '';
        if (ADMIN_EMAILS.includes(userEmail)) {
          document.querySelectorAll('.admin-nav-item').forEach(el => el.style.display = 'inline-block');
        }
      } else {
        authContainer.innerHTML = `
          <a href="src/login.html" class="btn" style="background: var(--bg-primary); border: 2px solid var(--border-subtle); color: var(--text-main); padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 700; font-size: 0.85rem; text-decoration: none;">Sign In</a>
        `;
      }
    }

    async function handleSignOut() {
      await window.mySupabaseInstance.auth.signOut();
      window.location.reload();
    }

    window.addEventListener('DOMContentLoaded', checkUserStatus);
  </script>
</body>
</html>
