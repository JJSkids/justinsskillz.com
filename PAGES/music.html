<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Theory | Justin's Skillz</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="nav-header">
        <a href="../dashboard.html" class="btn btn-primary">← Workspace Dashboard</a>
        <h2 style="margin: 0; font-size: 1.2rem; color: var(--accent-gold);">🎹 Music Theory & Synth</h2>
    </header>

    <main class="container">
        <div class="card" style="text-align: center;">
            <h1 style="margin-top: 0;">Interactive C Major Piano</h1>
            <p style="color: var(--text-muted);">Click key buttons below to trigger real audio frequencies:</p>

            <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin: 1.5rem 0;">
                <button onclick="playNote(261.63)" class="btn" style="background: #fff; color: #000; width: 50px; height: 120px;">C</button>
                <button onclick="playNote(293.66)" class="btn" style="background: #fff; color: #000; width: 50px; height: 120px;">D</button>
                <button onclick="playNote(329.63)" class="btn" style="background: #fff; color: #000; width: 50px; height: 120px;">E</button>
                <button onclick="playNote(349.23)" class="btn" style="background: #fff; color: #000; width: 50px; height: 120px;">F</button>
                <button onclick="playNote(392.00)" class="btn" style="background: #fff; color: #000; width: 50px; height: 120px;">G</button>
                <button onclick="playNote(440.00)" class="btn" style="background: #fff; color: #000; width: 50px; height: 120px;">A</button>
                <button onclick="playNote(493.88)" class="btn" style="background: #fff; color: #000; width: 50px; height: 120px;">B</button>
                <button onclick="playNote(523.25)" class="btn" style="background: #fff; color: #000; width: 50px; height: 120px;">C5</button>
            </div>

            <div class="result-box" style="color: var(--accent-gold);">
                Major Scale Step Formula: Whole — Whole — Half — Whole — Whole — Whole — Half
            </div>
        </div>
    </main>

    <script>
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playNote(freq) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
      }
    </script>
</body>
</html>
